# Solo da questo computer. Senza, Spring ascolta su tutte le interfacce e
# chiunque sia sulla stessa rete puo' leggere lo storico dei trade e scrivere
# nel registro: non c'e' autenticazione.
server:
  address: 127.0.0.1

spring:
  application:
    name: kraken-trading-journal
  jackson:
    default-property-inclusion: non_null
  datasource:
    # File, non memoria: il registro serve proprio a sopravvivere ai riavvii.
    url: jdbc:h2:file:./dati/registro;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  # Le pagine si ricontrollano a ogni apertura: senza, Chrome tiene in cache la
  # versione vecchia di una pagina anche dopo un riavvio dell'app.
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  jpa:
    hibernate:
      # Va bene finche' il progetto e' personale. Il giorno in cui i dati
      # contano davvero, questo diventa una migrazione versionata.
      ddl-auto: update
    open-in-view: false

kraken:
  base-url: https://api.kraken.com
  # Chiave con SOLI permessi di query. Mai Trade, mai Withdraw.
  api-key: ${KRAKEN_API_KEY}
  api-secret: ${KRAKEN_API_SECRET}

# Il lavoro del mattino (regola R2: una revisione al giorno, a orario fisso,
# su candela chiusa). Alle 9 e non alle 7: il computer si accende alle 9, e un
# lavoro pianificato a computer spento salta senza essere recuperato. Se
# l'app parte dopo, il lavoro si avvia a mano (o lo avvia il controllo delle 9:05).
giornaliero:
  # Le candele daily di Kraken chiudono a mezzanotte UTC: alle 9 quella di
  # ieri e' chiusa da ore, in qualunque stagione.
  cron: "0 0 9 * * *"
  # Esplicito, altrimenti Spring userebbe il fuso di sistema e con l'ora legale
  # il lavoro si sposterebbe di un'ora due volte l'anno.
  fuso: Europe/Rome

# Come il journal legge lo storico delle operazioni.
journal:
  # Sotto questa percentuale della quantita' massima tenuta, quello che resta
  # dopo una vendita e' polvere e non una posizione aperta. Percentuale e non
  # importo: un importo fisso vorrebbe dire una cosa in EUR e un'altra in USD.
  # I residui di HYPE e PEPE nei dati di novembre 2026 erano intorno allo 0,8%.
  residuo-trascurabile: 1

# Le soglie della guida operativa. Cambiarle e' cambiare metodo:
# farlo qui, tutto insieme, e non dentro un if.
scansione:
  # Congelata al 19/11/2026: le coppie in EUR su cui si opera davvero (prima
  # era una lista in USD, congelata al 23/09/2026). Fuori USDC/EUR ed EURC/EUR:
  # sono stablecoin, non hanno un trend da seguire. Non va ricostruita con le
  # coppie piu' scambiate del giorno: si sceglierebbero quelle sopravvissute.
  watchlist:
    - XBTEUR
    - ETHEUR
    - SOLEUR
    - XRPEUR
    - ZECEUR
    - ADAEUR
    - NEAREUR
    - AVAXEUR
    - LINKEUR
    - HYPEEUR
  volume-minimo: 1000000      # controvalore 24h nella valuta di quotazione (EUR)
  distanza-massima-dalla-media: 12   # %
  ampiezza-stop-minima: 5            # %
  ampiezza-stop-massima: 10          # %
  # Regola di uscita 2.2: l'obiettivo si costruisce a 2 R netti commissioni.
  # Non e' piu' un livello del grafico: dopo un breakout il massimo a 30 giorni
  # sta sotto l'entrata e non puo' fare da obiettivo.
  multiplo-obiettivo: 2.0
  capitale: 203
  rischio-per-operazione: 1          # % del capitale
  giorni-minimo-stop: 5
  margine-stop: 0.5                  # % sotto il minimo
  giorni-time-stop: 15
  registrazioni-per-giudizio: 15
  # Regola 2.3. Vale solo per le posizioni reali: la correlazione media fra le
  # coppie e' 0,686, quindi tre posizioni valgono 1,26 scommesse indipendenti
  # e ne costano tre. Le analisi su carta non hanno tetto.
  posizioni-massime: 2
  tipo-ordine: LIMITE
  # Il trigger provvisorio (BREAKOUT_20_GIORNI): l'ultima candela chiusa
  # chiude sopra il massimo dei giorni precedenti, con un controvalore almeno
  # pari a questo multiplo della loro media. Senza questo controllo il registro
  # chiamava "breakout" ogni coppia che passava i filtri.
  giorni-breakout: 20
  multiplo-volume-breakout: 1.5
  # Le regole che decidono se una coppia e' idonea (28/11/2026). Spente:
  # DISTANZA_DALLA_MEDIA, PREZZO_ATTUALE e AMPIEZZA_STOP. Sulle candele del
  # 02/2025-11/2026 distanza e ampiezza stop sceglievano giorni seguiti in media
  # da ribassi, prezzo del mattino ripeteva la rottura su pochi casi; il metodo con le sole tre qui sotto ha dato +0,17 R su 79
  # operazioni (margine 0,22) contro -0,42 R su 16. Ipotesi da confermare sul
  # registro, non risultato acquisito. Togliendo la riga tornano tutte e sei.
  controlli-attivi: [LIQUIDITA, TREND, BREAKOUT]

# Soglie del commento del journal (docs/regole-commento-journal.md). Come per
# la scansione: cambiarle e' cambiare il modo di leggere i dati.
commento:
  # Da qui gli acquisti si confrontano con il metodo: watchlist, registro,
  # dimensione, time stop, posizioni massime, ordini al giorno. E' la data
  # della watchlist in EUR.
  metodo-dal: "2026-11-19"
  quota-taker-massima: 50        # % del volume Pro eseguito a tariffa taker
  concentrazione-massima: 50     # % del volume di una valuta su una sola coppia
  ordini-al-giorno-massimi: 2    # una revisione al giorno: un'uscita e un'entrata
  giorni-registrazione: 3        # quanto prima dell'acquisto puo' stare la registrazione

# Il simulatore: stima su base statistica, verificata sul passato prima di
# essere mostrata. Le coppie sono la watchlist della scansione.
simulatore:
  # Fra quante candele giornaliere si guarda il prezzo. Sette e non trenta:
  # con un anno di dati, trenta giorni danno una dozzina di casi indipendenti
  # e un intervallo largo quasi quanto la scala.
  orizzonte: 7
  # La verifica walk-forward copre l'ultimo anno; le candele prima (Kraken ne
  # da' 720) servono solo come storia di partenza.
  giorni-verifica: 365
  # Uno stato con meno casi di cosi' usa la frequenza di tutti i giorni.
  casi-minimi: 30

logging:
  level:
    dev.kraken.journal: INFO
