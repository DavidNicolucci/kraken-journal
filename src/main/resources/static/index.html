<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro operazioni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/stile.css">
<style>

html{-webkit-text-size-adjust:100%}

/* ---------- intestazione ---------- */

.masthead{
  display:flex;flex-wrap:wrap;gap:20px;
  align-items:flex-end;justify-content:space-between;
  padding:38px 0 14px;
  border-bottom:2px solid var(--ink);
}

.period{
  font-size:12px;letter-spacing:.06em;
  color:var(--ink-soft);margin-top:4px;
}

.pages{display:flex;gap:0;border:1px solid var(--rule-strong)}
.pages a{font-size:12px;padding:7px 14px;text-decoration:none;color:var(--ink-soft);
  border-right:1px solid var(--rule-strong)}
.pages a:last-child{border-right:0}
.pages a:hover{background:var(--paper-raised);color:var(--ink)}
.pages a[aria-current]{background:var(--ink);color:var(--paper)}
.pages a:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}

.range{display:flex;gap:0;border:1px solid var(--rule-strong)}
.range button{
  font-family:var(--mono);font-size:12px;
  padding:7px 14px;
  background:transparent;color:var(--ink-soft);
  border:0;border-right:1px solid var(--rule-strong);
  cursor:pointer;
}
.range button:last-child{border-right:0}
.range button:hover{background:var(--paper-raised);color:var(--ink)}
.range button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.range button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}

/* ---------- blocchi ---------- */

section{padding:34px 0;border-bottom:1px solid var(--rule)}

/* ---------- tesi ---------- */

.thesis{
  display:flex;flex-wrap:wrap;align-items:baseline;
  gap:0 14px;margin:0 0 6px;
}
.thesis .n{
  font-family:var(--cond);font-weight:600;
  font-size:clamp(46px,11vw,74px);
  line-height:.92;letter-spacing:-.02em;
}
.thesis .what{
  font-family:var(--cond);font-weight:500;
  font-size:clamp(15px,2.6vw,19px);
  letter-spacing:.05em;text-transform:uppercase;
}
.thesis-note{
  font-family:var(--prose);font-size:17px;
  color:var(--ink-soft);max-width:56ch;margin:10px 0 0;
}

/* elemento firma: copertura dei dati */

.coverage{margin-top:30px}
.cov-bar{
  display:flex;height:30px;width:100%;
  border:1px solid var(--ink);
  background:var(--paper-raised);
}
.cov-known{background:var(--ink)}
.cov-unknown{
  background-image:repeating-linear-gradient(
    45deg,var(--unknown) 0 2px,transparent 2px 7px);
  border-left:1px solid var(--ink);
}
.cov-bar > div:first-child{border-left:0}
.cov-legend{
  display:flex;flex-wrap:wrap;gap:8px 26px;
  margin-top:10px;font-size:12px;color:var(--ink-soft);
}
.cov-legend span{display:flex;align-items:center;gap:8px}
.swatch{width:13px;height:13px;border:1px solid var(--ink);flex:none}
.swatch.unknown{
  background-image:repeating-linear-gradient(
    45deg,var(--unknown) 0 2px,transparent 2px 7px);
}
.swatch.known{background:var(--ink)}

/* ---------- cifre ---------- */

.fig dd.muted{color:var(--unknown)}
.sub-inline{font-size:.6em;color:var(--ink-soft);letter-spacing:.04em}

/* ---------- costi ---------- */

.cost-row{
  display:grid;
  grid-template-columns:minmax(96px,1.1fr) 3fr minmax(74px,auto);
  gap:14px;align-items:center;
  padding:11px 0;border-top:1px solid var(--rule);
}
.cost-row:last-child{border-bottom:1px solid var(--rule)}
.cost-name{font-size:13px;overflow:hidden;text-overflow:ellipsis}
.cost-track{position:relative;height:15px;background:var(--paper-raised);border:1px solid var(--rule)}
.cost-fill{position:absolute;inset:0 auto 0 0;background:var(--cost)}
.cost-fill.fx{
  background-image:repeating-linear-gradient(
    45deg,var(--cost) 0 3px,transparent 3px 6px);
  background-color:transparent;
}
.tick{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--ink);opacity:.45;z-index:2}
.cost-fill{z-index:1}
.cost-pct{
  text-align:right;font-size:13px;font-weight:500;
  font-variant-numeric:tabular-nums;
}
.tier-key{margin:14px 0 0;font-size:12px;color:var(--ink-soft)}

/* ---------- tabella ---------- */

.scroller{overflow-x:auto}
table{min-width:620px}
th,td{white-space:nowrap}

tbody tr:hover td{background:var(--paper-raised)}
.tag{
  font-family:var(--cond);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft);
  border:1px solid var(--rule-strong);padding:1px 5px;margin-left:7px;
}
.na{
  display:inline-block;color:var(--unknown);
  padding:2px 8px;
  background-image:repeating-linear-gradient(
    45deg,rgba(138,111,46,.28) 0 2px,transparent 2px 7px);
  border:1px solid var(--unknown);
}
.pos{color:var(--gain)}
.neg{color:var(--cost)}

/* ---------- lettura ---------- */

.prose{font-family:var(--prose);font-size:18px;line-height:1.62;max-width:64ch}
.prose p{margin:0 0 18px}
.findings{list-style:none;padding:0;margin:0;max-width:66ch}
.findings li{
  font-family:var(--prose);font-size:17px;line-height:1.55;
  padding:12px 0 12px 30px;border-top:1px solid var(--rule);position:relative;
}
.findings li::before{
  content:"";position:absolute;left:2px;top:21px;
  width:13px;height:1px;background:var(--rule-strong);
}
.findings li:last-child{border-bottom:1px solid var(--rule)}

.caveat{
  border-left:3px solid var(--unknown);
  padding:2px 0 2px 18px;margin-top:8px;
  font-family:var(--prose);font-size:16px;line-height:1.55;
  color:var(--ink-soft);max-width:64ch;
}

.notice{
  border:1px solid var(--unknown);
  padding:13px 15px;margin:0 0 26px;
  font-size:13px;line-height:1.5;
  background:var(--paper-raised);
}
.notice b{font-weight:600}

.state{padding:60px 0;font-size:14px;color:var(--ink-soft)}
.state.error{color:var(--cost)}


@media (max-width:620px){
  .cost-row{grid-template-columns:1fr auto;row-gap:7px}
  .cost-track{grid-column:1/-1;order:3}
}
@media (prefers-reduced-motion:no-preference){
  .fade{animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="sheet">

  <header class="masthead">
    <div>
      <h1>Registro operazioni</h1>
      <div class="period" id="period">—</div>
    </div>
    <nav class="pages">
      <a href="/" aria-current="page">Registro</a>
      <a href="/calcolatore.html">Calcolatore</a>
      <a href="/scansione.html">Scansione</a>
      <a href="/simulatore.html">Simulatore</a>
      <a href="/verifica.html">Verifica</a>
    </nav>
    <div class="range" id="range" role="group" aria-label="Periodo">
      <button type="button" data-days="30">30 g</button>
      <button type="button" data-days="90" aria-pressed="true">90 g</button>
      <button type="button" data-days="365">1 anno</button>
    </div>
  </header>

  <div id="out"><div class="state" id="state">Carico il registro…</div></div>

</div>

<script>
const out = document.getElementById('out');
/** Tariffe di Kraken Pro in percentuale, dal server (TipoOrdine). */
let tariffe = {};
const periodEl = document.getElementById('period');

const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const data = iso => { const d = new Date(iso); return `${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`; };
const esc  = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num  = (v, d = 2) => v === null || v === undefined
  ? null : Number(v).toLocaleString('it-IT', {minimumFractionDigits: d, maximumFractionDigits: d});

/** Percentuale di commissione effettivamente pagata su una coppia. */
const feePct = p => p.feesToVolumePercent ?? (p.volumeQuote > 0 ? (p.feesPaid / p.volumeQuote) * 100 : 0);

/** Un valore per ogni valuta, ciascuno con il suo codice: EUR e USD non si sommano. */
const perValuta = (totali, valore) => totali
  .map(t => ({ v: valore(t), c: t.valuta }))
  .filter(x => x.v !== null && x.v !== undefined)
  .map(x => `${x.v} <span class="sub-inline">${esc(x.c)}</span>`)
  .join('<br>') || '—';

/** Quota del volume di Kraken Pro eseguita subito, alla tariffa taker. Null se non si sa. */
const quotaTaker = t => {
  const noto = t.volumeMaker + t.volumeTaker;
  return noto > 0 ? num(t.volumeTaker / noto * 100, 0) + '%' : null;
};

const segno = v => (v > 0 ? '+' : '') + num(v);
const classeSegno = v => v >= 0 ? 'pos' : 'neg';

/** Perché il risultato di una coppia non è completo, con la provenienza letta dal ledger. */
function motivoIncompleto(p) {
  const parti = [];
  if (p.unmatchedSellVolume > 0) {
    parti.push(`Venduto ${num(p.unmatchedSellVolume, 4)} senza un acquisto in tutto lo storico`
      + (p.provenienze?.length ? `: risulta da ${p.provenienze.join(', ')}` : ''));
  }
  if (p.quantitaInAltraValuta > 0) {
    parti.push(`Venduto ${num(p.quantitaInAltraValuta, 4)} comprato in un'altra valuta, in giorni senza un cambio`);
  }
  return parti.join('. ') + '.';
}

/** Segnala un risultato che contiene un costo convertito da un'altra valuta. */
const tagCambio = p => p.quantitaConvertita > 0
  ? `<span class="tag" title="Venduto ${num(p.quantitaConvertita, 4)} comprato in un'altra valuta: il costo è convertito al cambio medio del giorno della vendita">cambio</span>`
  : '';

function render(j) {
  const s = j.stats, r = j.report;
  const pairs   = s.byPair || [];
  const trading = pairs.filter(p => !p.fxConversion);
  const fx      = pairs.filter(p => p.fxConversion);
  const totali  = s.totaliPerValuta || [];
  const ordiniTrading = (s.ordini || []).filter(o => !o.conversione).length;
  // Un cambio eseguito in sette pezzi e' una conversione sola: si contano gli ordini.
  const ordiniCambio  = (s.ordini || []).filter(o => o.conversione).length;
  const conversioni   = n => n === 1 ? 'una conversione valutaria' : `${n} conversioni valutarie`;
  // Le commissioni di cambio sono in valute diverse (USD/EUR in EUR, EUR/USD in USD): una riga per valuta.
  const commissioniCambio = Object.values(fx.reduce((acc, p) => {
    (acc[p.quoteCurrency] ??= {valuta: p.quoteCurrency, commissioni: 0}).commissioni += p.feesPaid;
    return acc;
  }, {}));
  const chiuse  = s.operazioniChiuse || [];
  const aperte  = s.posizioniAperte || [];

  periodEl.textContent = `${data(s.periodStart)} — ${data(s.periodEnd)}`;

  // Copertura: quota di volume con costo di carico ricostruibile.
  const volTot   = trading.reduce((a, p) => a + p.volumeQuote, 0);
  const volNoto  = trading.filter(p => p.pnlComplete).reduce((a, p) => a + p.volumeQuote, 0);
  const pctNoto  = volTot > 0 ? (volNoto / volTot) * 100 : 0;

  // La scala arriva sempre oltre la tariffa piu' alta: sotto quella soglia le
  // barre sarebbero enormi e il confronto con le aliquote perderebbe senso.
  const maxPct = Math.max(tariffe.MERCATO * 1.12, ...pairs.map(feePct)) * 1.08;

  out.innerHTML = `
  <section class="fade">
    ${s.ledgerLetto === false ? `<p class="notice">
      <b>Mancano le operazioni fatte dall'app.</b>
      La chiave API non ha il permesso <i>Query Ledger Entries</i>: il journal
      vede solo gli ordini di Kraken Pro, e le vendite di monete comprate
      dall'app risultano senza acquisto.
    </p>` : ''}
    ${s.mixedQuoteCurrencies ? `<p class="notice">
      <b>Valute diverse (${s.quoteCurrencies.join(', ')}).</b>
      Le cifre qui sotto sono date per ogni valuta, senza sommarle fra loro.
    </p>` : ''}

    <p class="eyebrow">Attività del periodo</p>
    <div class="thesis">
      <span class="n">${ordiniTrading}</span>
      <span class="what">ordin${ordiniTrading === 1 ? 'e' : 'i'} di trading</span>
    </div>
    <p class="thesis-note">
      Kraken ha registrato ${s.totalOperations} esecuzion${s.totalOperations === 1 ? 'e' : 'i'}${s.fxConversions > 0
        ? `, di cui ${s.fxConversions} per ${conversioni(ordiniCambio)}: spostare denaro, non prendere posizione`
        : ''}.
      ${s.tradingTrades > ordiniTrading
        ? `Alcuni ordini sono stati eseguiti in più pezzi: qui contano una volta.`
        : ''}
      ${s.tradingDays > 0
        ? `Concentrate in ${s.tradingDays} giorn${s.tradingDays === 1 ? 'o' : 'i'}.`
        : ''}
    </p>

    <div class="coverage">
      <p class="eyebrow" style="margin-bottom:10px">Quanto di questo periodo è misurabile</p>
      <div class="cov-bar" role="img"
           aria-label="${pctNoto.toFixed(0)}% del volume ha costo di carico noto">
        ${pctNoto > 0 ? `<div class="cov-known" style="flex:${pctNoto}"></div>` : ''}
        ${pctNoto < 100 ? `<div class="cov-unknown" style="flex:${100 - pctNoto}"></div>` : ''}
      </div>
      <div class="cov-legend">
        <span><i class="swatch known"></i> ${pctNoto.toFixed(0)}% costo di carico noto</span>
        <span><i class="swatch unknown"></i> ${(100 - pctNoto).toFixed(0)}% su coppie con vendite senza costo di carico</span>
      </div>
    </div>
  </section>

  <section class="fade">
    <p class="eyebrow">Cifre</p>
    <dl class="figures">
      <div class="fig">
        <dt>Volume di trading</dt>
        <dd>${perValuta(totali, t => num(t.volume))}</dd>
      </div>
      <div class="fig">
        <dt>Commissioni di trading</dt>
        <dd>${perValuta(totali, t => num(t.commissioni, 3))}<span class="sub">${totali
          .map(t => `${num(t.commissioniPercentuale)}% del volume in ${esc(t.valuta)}`).join(' · ')}</span></dd>
      </div>
      <div class="fig">
        <dt>Eseguito a tariffa taker</dt>
        <dd>${perValuta(totali, quotaTaker)}<span class="sub">del volume di Kraken Pro con il dato maker/taker</span></dd>
      </div>
      ${totali.some(t => t.volumeApp > 0) ? `<div class="fig">
        <dt>Passato dall'app</dt>
        <dd>${perValuta(totali.filter(t => t.volumeApp > 0), t => num(t.volumeApp))}<span class="sub">commissioni ${totali
          .filter(t => t.volumeApp > 0).map(t => num(t.commissioniApp, 3) + ' ' + esc(t.valuta)).join(' · ')}, spread escluso</span></dd>
      </div>` : ''}
      <div class="fig">
        <dt>Commissioni di cambio</dt>
        <dd>${perValuta(commissioniCambio, t => num(t.commissioni, 3))}<span class="sub">${conversioni(ordiniCambio)}${s.fxConversions > ordiniCambio ? `, in ${s.fxConversions} esecuzioni` : ''}</span></dd>
      </div>
      <div class="fig">
        <dt>Risultato realizzato</dt>
        ${totali.every(t => t.risultato === null || t.risultato === undefined)
          ? `<dd class="muted">non calcolabile<span class="sub">nessuna vendita del periodo ha un costo di carico</span></dd>`
          : `<dd${s.pairsWithIncompletePnl > 0 ? ' class="muted"' : ''}>${perValuta(totali, t => t.risultato === null || t.risultato === undefined ? null : `<span class="${classeSegno(t.risultato)}">${segno(t.risultato)}</span>`)}${s.pairsWithIncompletePnl > 0
              ? `<span class="sub">parziale: ${s.pairsWithIncompletePnl} copp${s.pairsWithIncompletePnl === 1 ? 'ia ha' : 'ie hanno'} vendite senza costo di carico</span>`
              : ''}</dd>`}
      </div>
    </dl>
  </section>

  ${pairs.length ? `
  <section class="fade">
    <p class="eyebrow">Quanto ti è costato operare</p>
    ${pairs.slice().sort((a, b) => feePct(b) - feePct(a)).map(p => {
      const pct = feePct(p);
      return `<div class="cost-row">
        <div class="cost-name">${esc(p.displayName)}${p.fxConversion ? '<span class="tag">cambio</span>' : ''}${p.operazioniDaApp > 0 ? '<span class="tag">app</span>' : ''}</div>
        <div class="cost-track">
          <div class="cost-fill${p.fxConversion ? ' fx' : ''}" style="width:${(pct / maxPct) * 100}%"></div>
          <div class="tick" style="left:${(tariffe.LIMITE / maxPct) * 100}%"></div>
          <div class="tick" style="left:${(tariffe.MERCATO / maxPct) * 100}%"></div>
        </div>
        <div class="cost-pct">${num(pct)}%</div>
      </div>`;
    }).join('')}
    <p class="tier-key">
      Le due tacche sono le tue aliquote Kraken Pro: ${num(tariffe.LIMITE)}% con ordine limite,
      ${num(tariffe.MERCATO)}% a mercato. Una barra vicina alla tacca destra è un ordine che ha
      pagato il doppio del necessario. Le operazioni fatte dall'app hanno una
      commissione loro, e uno spread che non compare qui perché sta nel prezzo.
    </p>
  </section>` : ''}

  ${trading.length ? `
  <section class="fade">
    <p class="eyebrow">Dettaglio per coppia</p>
    <div class="scroller"><table>
      <thead><tr>
        <th>Coppia</th><th>Ordini</th><th>Acq.</th><th>Vend.</th>
        <th>Volume</th><th>Commissioni</th><th>Risultato</th><th>Posizione aperta</th>
      </tr></thead>
      <tbody>${trading.map(p => `<tr>
        <td>${esc(p.displayName)}${p.operazioniDaApp > 0 ? '<span class="tag">app</span>' : ''}</td>
        <td title="${p.tradeCount} esecuzion${p.tradeCount === 1 ? 'e' : 'i'}">${p.ordini}</td>
        <td>${p.buyCount}</td>
        <td>${p.sellCount}</td>
        <td>${num(p.volumeQuote)} <span style="color:var(--ink-soft)">${esc(p.quoteCurrency)}</span></td>
        <td>${num(p.feesPaid, 3)}</td>
        <td>${!p.pnlComplete && (p.realizedPnl === null || p.realizedPnl === undefined)
              ? `<span class="na" title="${esc(motivoIncompleto(p))}">non calcolabile</span>`
              : !p.pnlComplete
                ? `<span class="${classeSegno(p.realizedPnl)}">${num(p.realizedPnl, 3)}</span><span class="tag" title="${esc(motivoIncompleto(p))}">parziale</span>${tagCambio(p)}`
              : p.sellCount === 0
                ? `<span style="color:var(--ink-soft)" title="Comprato e non ancora venduto: non c'è un risultato da realizzare">non realizzato</span>`
                : `<span class="${classeSegno(p.realizedPnl)}">${num(p.realizedPnl, 3)}</span>${tagCambio(p)}`}</td>
        <td>${p.openPosition > 0 ? num(p.openPosition, 4) : '—'}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    ${fx.length ? `<p class="tier-key">
      ${fx.length === 1 ? 'Esclusa' : 'Escluse'} da questa tabella:
      ${fx.map(p => esc(p.displayName)).join(', ')} — ${conversioni(ordiniCambio)}.
    </p>` : ''}
  </section>` : ''}

  ${chiuse.length ? `
  <section class="fade">
    <p class="eyebrow">Operazioni chiuse nel periodo</p>
    <div class="scroller"><table>
      <thead><tr>
        <th>Coppia</th><th>Aperta</th><th>Chiusa</th><th>Giorni</th><th>Investito</th><th>Risultato</th>
      </tr></thead>
      <tbody>${chiuse.map(o => `<tr>
        <td>${esc(o.coppia)}</td>
        <td>${data(o.apertura)}</td>
        <td>${data(o.chiusura)}</td>
        <td>${o.giorni}</td>
        <td>${o.investito === null || o.investito === undefined
              ? `<span class="na" title="Un acquisto è in un'altra valuta, senza un cambio">non calcolabile</span>`
              : `${num(o.investito)} <span style="color:var(--ink-soft)">${esc(o.valuta)}</span>`}</td>
        <td>${o.risultato === null || o.risultato === undefined
              ? `<span class="na" title="Una parte è stata comprata o venduta in un'altra valuta">non calcolabile</span>`
              : `<span class="${classeSegno(o.risultato)}">${segno(o.risultato)}</span>`}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    <p class="tier-key">
      Un'operazione va dalla prima entrata su una moneta a quando ne resta solo
      polvere, anche se è fatta di più acquisti e più vendite.
    </p>
  </section>` : ''}

  ${aperte.length ? `
  <section class="fade">
    <p class="eyebrow">Posizioni aperte adesso</p>
    <div class="scroller"><table>
      <thead><tr>
        <th>Coppia</th><th>Quantità</th><th>Costo di carico</th><th>Aperta dal</th>
      </tr></thead>
      <tbody>${aperte.map(a => `<tr>
        <td>${esc(a.coppia)}</td>
        <td>${num(a.quantita, 4)}</td>
        <td>${num(a.costo)} <span style="color:var(--ink-soft)">${esc(a.valuta)}</span></td>
        <td>${data(a.apertaDal)}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    <p class="tier-key">
      Il costo è quanto hai pagato, commissioni comprese: non è il valore di oggi.
    </p>
  </section>` : ''}

  <section class="fade">
    <p class="eyebrow">Lettura</p>
    <div class="prose"><p>${esc(r.summary)}</p></div>

    ${r.observedPatterns?.length ? `
      <p class="eyebrow" style="margin-top:30px">Cosa dicono i dati</p>
      <ul class="findings">${r.observedPatterns.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}

    ${r.questionsToAskYourself?.length ? `
      <p class="eyebrow" style="margin-top:30px">Domande da porti</p>
      <ul class="findings">${r.questionsToAskYourself.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}

    ${r.dataCaveat ? `
      <p class="eyebrow" style="margin-top:30px">Limiti di questi dati</p>
      <p class="caveat">${esc(r.dataCaveat)}</p>` : ''}
  </section>

  <footer>
    Le cifre sono calcolate dal codice a partire dallo storico Kraken. La lettura
    è scritta da regole fisse a partire da quelle cifre: stessi dati, stesso testo,
    e nessun dato esce da questo computer. Il risultato usa il costo medio
    ponderato, non il LIFO fiscale.
  </footer>`;
}

/** La richiesta in corso: un clic su un altro periodo la annulla, cosi' una risposta lenta non copre quella scelta. */
let richiesta = null;

async function load(days) {
  richiesta?.abort();
  const { signal } = richiesta = new AbortController();
  out.innerHTML = `<div class="state">Carico il registro…</div>`;
  try {
    const [res, resTariffe] = await Promise.all([fetch(`/api/journal?days=${days}`, { signal }), fetch('/api/tariffe', { signal })]);
    if (!res.ok) throw new Error(`Il server ha risposto ${res.status}. Controlla la console di IntelliJ.`);
    if (!resTariffe.ok) throw new Error(`Tariffe non disponibili: il server ha risposto ${resTariffe.status}.`);
    tariffe = await resTariffe.json();
    render(await res.json());
  } catch (e) {
    if (e.name !== 'AbortError') out.innerHTML = `<div class="state error">${esc(e.message)}</div>`;
  }
}

document.getElementById('range').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  document.querySelectorAll('#range button').forEach(x => x.removeAttribute('aria-pressed'));
  b.setAttribute('aria-pressed', 'true');
  load(b.dataset.days);
});

load(90);
</script>
